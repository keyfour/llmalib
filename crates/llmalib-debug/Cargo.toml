[package]
name = "llmalib-debug"
version.workspace = true
edition.workspace = true
description = "Observability tools for llmalib: tracer, inspector, replay"

[dependencies]
llmalib-core = { path = "../llmalib-core" }
llmalib-reliability = { path = "../llmalib-reliability" }
llmalib-memory = { path = "../llmalib-memory" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"