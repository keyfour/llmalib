[package]
name = "llmalib-memory"
version = "0.1.0"
edition = "2021"
description = "Memory package for llmalib: KV stores, token budgeting, few-shot examples"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
thiserror = "2.0"
llmalib-core = { path = "../llmalib-core" }

[dev-dependencies]
tempfile = "3.0"